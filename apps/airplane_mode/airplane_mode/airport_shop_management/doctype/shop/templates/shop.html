{% extends "templates/web.html" %}

{% block page_content %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    /* General Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Arial', sans-serif;
      background-color: #f8f9fa;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      width: 90%;
      max-width: 600px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      text-align: center;
    }

    .title {
      font-size: 24px;
      font-weight: bold;
      color: #007bff;
      margin-bottom: 20px;
    }

    .info {
      font-size: 18px;
      color: #555;
      margin: 10px 0;
      text-align: left;
      line-height: 1.6;
    }

    .status {
      font-size: 20px;
      font-weight: bold;
      color: #28a745;
      margin: 20px 0;
    }

    .btn {
      display: inline-block;
      background-color: #007bff;
      color: #fff;
      padding: 10px 20px;
      text-decoration: none;
      font-size: 16px;
      border-radius: 6px;
      margin-top: 20px;
      transition: background-color 0.3s ease;
    }

    .btn:hover {
      background-color: #0056b3;
    }

    /* Responsive Design */
    @media (max-width: 480px) {
      .title {
        font-size: 20px;
      }

      .info {
        font-size: 16px;
      }

      .status {
        font-size: 18px;
      }

      .btn {
        font-size: 14px;
        padding: 8px 16px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="title">{{ title |e }}</h1>
    <div class="info">
      <p><strong>Area of the Shop:</strong> {{ area }}</p>
      <p><strong>Airport:</strong> {{ airport_address }}</p>
    </div>
    <div class="status">Status of the Shop: {{ status }}</div>
    <!-- Uncomment the button below if needed -->
    <!-- <a href="http://airplane_mode.com:8000/ticket-booking/new?flight={{ doc.Flight }}&flight_price={{ doc.flight_price }}" class="btn">Book Ticket</a> -->
  </div>
</body>
</html>
{% endblock %}
